; Export presets (tech/01 §10.1). Committed without signing secrets: keystores / certificates are
; supplied at export time via environment variables (GODOT_ANDROID_KEYSTORE_RELEASE_PATH, _USER,
; _PASSWORD) or the editor, never stored in the repository.
; include_filter: pack data (JSON) is read with FileAccess and is not an imported resource, so it must
; be included explicitly. exclude_filter: dev-only tools, tests and the new-game kit (kit/) never ship.

[preset.0]

name="Android"
platform="Android"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.json, assets/fonts/*.txt"
exclude_filter="tools/*, tests/*, kit/*"
export_path="build/android/age-of-the-codex.aab"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

gradle_build/use_gradle_build=true
gradle_build/export_format=1
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=1
version/name="1.0.0"
package/unique_name="com.example.ageofthecodex"
package/name="Age of the Codex"
package/signed=true
package/app_category=2
package/retain_data_on_uninstall=false
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
permissions/internet=false
launcher_icons/main_192x192="res://assets/brand/app_icon_192.png"
launcher_icons/adaptive_foreground_432x432="res://assets/brand/android_adaptive_foreground_432.png"
launcher_icons/adaptive_background_432x432="res://assets/brand/android_adaptive_background_432.png"

